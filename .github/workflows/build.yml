name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]         # also build when you push a version tag
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false     # one failing OS shouldn't kill the other
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SkyroomBot-linux
            exe_path: dist/SkyroomBot
          - os: windows-latest
            artifact_name: SkyroomBot-windows
            exe_path: dist/SkyroomBot.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download chromedriver
        run: python scripts/download_chromedriver.py

      # ---- Linux only: minimal X libs so PyQt6 can import at runtime ----
      - name: Install Linux runtime libs (for Qt)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0

      - name: Build
        run: python -m PyInstaller --clean --noconfirm skyroom_bot.spec

      # ---- Linux only: mark the binary executable ----
      - name: Make Linux binary executable
        if: matrix.os == 'ubuntu-latest'
        run: chmod +x dist/SkyroomBot

      # ---- Quick smoke test that the binary starts (headless) ----
      - name: Smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 15 ./dist/SkyroomBot --help || true
          echo "binary exists: $(test -f dist/SkyroomBot && echo yes || echo no)"

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          if (Test-Path dist/SkyroomBot.exe) { echo "binary exists" }
          else { throw "binary not built" }
        shell: pwsh

      # ---- Package the single executable into a zip for easier download ----
      - name: Package artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }}.zip SkyroomBot

      - name: Package artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\SkyroomBot.exe -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 30


  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show files
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SkyroomBot-linux/*.zip
            artifacts/SkyroomBot-windows/*.zip
          generate_release_notes: true
          draft: false