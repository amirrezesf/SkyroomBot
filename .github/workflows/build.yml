name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_base:
        description: 'Build base variant'
        type: boolean
        default: true
      build_full:
        description: 'Build full variant (with Jarvis)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # =========================================================
  # 0) Guard: decide what to build, compute version
  # =========================================================
  guard:
    name: Decide what to build
    runs-on: ubuntu-latest
    outputs:
      should_run:  ${{ steps.decide.outputs.should_run }}
      version:     ${{ steps.ver.outputs.version }}
      version_nov: ${{ steps.ver.outputs.version_nov }}
      build_base:  ${{ steps.decide.outputs.build_base }}
      build_full:  ${{ steps.decide.outputs.build_full }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide what to build
        id: decide
        shell: bash
        run: |
          set -e
          MSG="${{ github.event.head_commit.message }}"
          REF_TYPE="${{ github.ref_type }}"
          EVENT="${{ github.event_name }}"

          BUILD_BASE="false"
          BUILD_FULL="false"

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            BUILD_BASE="${{ inputs.build_base }}"
            BUILD_FULL="${{ inputs.build_full }}"
            echo "Manual dispatch: base=$BUILD_BASE full=$BUILD_FULL"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            BUILD_BASE="true"
            BUILD_FULL="true"
            echo "Tag push: building both"
          else
            if echo "$MSG" | grep -q '\[skip ci\]'; then
              BUILD_BASE="false"; BUILD_FULL="false"
              echo "Skipped due to [skip ci]"
            elif echo "$MSG" | grep -q '\[build\]'; then
              BUILD_BASE="true"; BUILD_FULL="true"
              echo "Triggered by [build]: both variants"
            else
              echo "$MSG" | grep -q '\[build-base\]' && BUILD_BASE="true"
              echo "$MSG" | grep -q '\[build-full\]' && BUILD_FULL="true"
            fi
          fi

          if [[ "$BUILD_BASE" == "false" && "$BUILD_FULL" == "false" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "build_base=$BUILD_BASE" >> "$GITHUB_OUTPUT"
          echo "build_full=$BUILD_FULL" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -e
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            BASE=$(cat VERSION | tr -d '[:space:]')
            TAG="v${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version_nov=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $TAG"

  # =========================================================
  # 1) Build — one job per (os, variant) that is requested
  # =========================================================
  build:
    name: Build ${{ matrix.variant }} on ${{ matrix.os }}
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ""
            variant: base
          - os: ubuntu-latest
            platform: linux
            ext: ""
            variant: full
          - os: windows-latest
            platform: windows
            ext: ".exe"
            variant: base
          - os: windows-latest
            platform: windows
            ext: ".exe"
            variant: full

    steps:
      - name: Skip if this variant is not requested
        id: gate
        shell: bash
        run: |
          case "${{ matrix.variant }}" in
            base) FLAG="${{ needs.guard.outputs.build_base }}" ;;
            full) FLAG="${{ needs.guard.outputs.build_full }}" ;;
            *)    FLAG="false" ;;
          esac
          echo "enabled=$FLAG" >> "$GITHUB_OUTPUT"

      - name: Checkout current commit
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install base dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Jarvis (full variant only)
        if: |
          steps.gate.outputs.enabled == 'true' &&
          matrix.variant == 'full'
        run: |
          pip install "git+https://github.com/amirrezesf/Jarvis.git@v0.2.0"

      - name: Download matching chromedriver
        if: steps.gate.outputs.enabled == 'true'
        run: python scripts/download_chromedriver.py

      - name: Install Linux runtime libraries (Qt)
        if: |
          steps.gate.outputs.enabled == 'true' &&
          matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0

      - name: Build with PyInstaller
        if: steps.gate.outputs.enabled == 'true'
        env:
          BUILD_VARIANT: ${{ matrix.variant }}
        run: python -m PyInstaller --clean --noconfirm skyroom_bot.spec

      - name: Rename and package output
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -e
          VERSION="${{ needs.guard.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          VARIANT="${{ matrix.variant }}"
          EXT="${{ matrix.ext }}"

          if [[ "$VARIANT" == "full" ]]; then
            # onedir — folder must be archived
            cd dist
            if [[ "$PLATFORM" == "windows" ]]; then
              FINAL="SkyroomBot-${VERSION}-${PLATFORM}-x64-${VARIANT}.zip"
              7z a -tzip "$FINAL" SkyroomBot/
            else
              FINAL="SkyroomBot-${VERSION}-${PLATFORM}-x64-${VARIANT}.tar.gz"
              tar -czf "$FINAL" SkyroomBot/
            fi
          else
            # onefile — single binary
            FINAL="SkyroomBot-${VERSION}-${PLATFORM}-x64-${VARIANT}${EXT}"
            cd dist
            mv "SkyroomBot${EXT}" "$FINAL"
          fi
          echo "Final name: $FINAL"
          ls -la

      - name: Make Linux base binary executable
        if: |
          steps.gate.outputs.enabled == 'true' &&
          matrix.os == 'ubuntu-latest' &&
          matrix.variant == 'base'
        shell: bash
        run: |
          chmod +x "dist/SkyroomBot-${{ needs.guard.outputs.version }}-linux-x64-base"

      - name: Smoke test (Linux)
        if: |
          steps.gate.outputs.enabled == 'true' &&
          matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [[ "${{ matrix.variant }}" == "full" ]]; then
            ARCHIVE="dist/SkyroomBot-${{ needs.guard.outputs.version }}-linux-x64-full.tar.gz"
            mkdir -p /tmp/smoke && tar -xzf "$ARCHIVE" -C /tmp/smoke
            BIN="/tmp/smoke/SkyroomBot/SkyroomBot"
          else
            BIN="dist/SkyroomBot-${{ needs.guard.outputs.version }}-linux-x64-base"
          fi
          test -f "$BIN" && echo "binary exists"
          timeout 10 "$BIN" || true

      - name: Smoke test (Windows)
        if: |
          steps.gate.outputs.enabled == 'true' &&
          matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if ("${{ matrix.variant }}" -eq "full") {
            $archive = "dist/SkyroomBot-${{ needs.guard.outputs.version }}-windows-x64-full.zip"
            if (-not (Test-Path $archive)) { throw "archive missing: $archive" }
            Write-Host "archive exists: $archive"
          } else {
            $bin = "dist/SkyroomBot-${{ needs.guard.outputs.version }}-windows-x64-base.exe"
            if (-not (Test-Path $bin)) { throw "binary not built: $bin" }
            Write-Host "binary exists: $bin"
          }

      - name: Upload artifact
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.variant }}
          path: |
            dist/SkyroomBot-*.tar.gz
            dist/SkyroomBot-*.zip
            dist/SkyroomBot-*-base
            dist/SkyroomBot-*-base.exe
          if-no-files-found: error

  # =========================================================
  # 2) Release — combine fresh builds + carried-over variants
  # =========================================================
  release:
    name: Publish GitHub Release
    needs: [guard, build]
    if: |
      needs.guard.outputs.should_run == 'true' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download fresh artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Find previous release
        id: prev
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PREV=$(gh release list --limit 1 --json tagName \
                 --jq '.[0].tagName // empty' 2>/dev/null || echo "")
          echo "Previous: ${PREV:-none}"
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Carry over non-built variants
        id: carry
        shell: bash
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          VERSION:    ${{ needs.guard.outputs.version }}
          PREV_TAG:   ${{ steps.prev.outputs.tag }}
          BUILD_BASE: ${{ needs.guard.outputs.build_base }}
          BUILD_FULL: ${{ needs.guard.outputs.build_full }}
        run: |
          set -e
          CARRIED_BASE="false"
          CARRIED_FULL="false"

          if [[ -z "$PREV_TAG" ]]; then
            echo "First release; nothing to carry."
            echo "carried_base=false" >> "$GITHUB_OUTPUT"
            echo "carried_full=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p artifacts/carried

          if [[ "$BUILD_BASE" == "false" ]]; then
            echo "Carrying base from $PREV_TAG"
            gh release download "$PREV_TAG" \
              -p "SkyroomBot-*-linux-x64-base" \
              -p "SkyroomBot-*-windows-x64-base.exe" \
              -D artifacts/carried 2>/dev/null || true
            CARRIED_BASE="true"
          fi

          if [[ "$BUILD_FULL" == "false" ]]; then
            echo "Carrying full from $PREV_TAG"
            gh release download "$PREV_TAG" \
              -p "SkyroomBot-*-linux-x64-full.tar.gz" \
              -p "SkyroomBot-*-windows-x64-full.zip" \
              -D artifacts/carried 2>/dev/null || true
            CARRIED_FULL="true"
          fi

          # Rename carried files to the new version so the release is
          # internally consistent.
          for f in artifacts/carried/SkyroomBot-*; do
            [[ -e "$f" ]] || continue
            base=$(basename "$f")
            newname=$(echo "$base" | sed -E \
              "s/SkyroomBot-[^-]+-(linux|windows)/SkyroomBot-${VERSION}-\1/")
            mv "$f" "artifacts/carried/$newname"
            echo "Renamed: $base -> $newname"
          done

          echo "carried_base=$CARRIED_BASE" >> "$GITHUB_OUTPUT"
          echo "carried_full=$CARRIED_FULL" >> "$GITHUB_OUTPUT"

      - name: Consolidate artifacts into one directory
        shell: bash
        run: |
          set -e
          mkdir -p release
          find artifacts -type f \( \
              -name 'SkyroomBot-*.tar.gz' -o \
              -name 'SkyroomBot-*.zip' -o \
              -name 'SkyroomBot-*-base' -o \
              -name 'SkyroomBot-*-base.exe' \) \
            -exec cp -v {} release/ \;
          ls -la release/

      - name: Generate checksums and detect files
        id: sums
        shell: bash
        run: |
          set -e
          cd release
          sha256sum SkyroomBot-* > SHA256SUMS
          cat SHA256SUMS

          LINUX_BASE=$(ls SkyroomBot-*-linux-x64-base 2>/dev/null || echo "")
          LINUX_FULL=$(ls SkyroomBot-*-linux-x64-full.tar.gz 2>/dev/null || echo "")
          WIN_BASE=$(ls SkyroomBot-*-windows-x64-base.exe 2>/dev/null || echo "")
          WIN_FULL=$(ls SkyroomBot-*-windows-x64-full.zip 2>/dev/null || echo "")

          {
            echo "linux_base=$LINUX_BASE"
            echo "linux_full=$LINUX_FULL"
            echo "win_base=$WIN_BASE"
            echo "win_full=$WIN_FULL"
          } >> "$GITHUB_OUTPUT"

      - name: Build changelog
        id: changelog
        shell: bash
        run: |
          set -e
          TAG="${{ needs.guard.outputs.version }}"
          PREV="${{ steps.prev.outputs.tag }}"

          if [[ -z "$PREV" ]]; then
            RANGE="HEAD"; SINCE_TEXT="Initial public release"
          else
            RANGE="${PREV}..HEAD"; SINCE_TEXT="Changes since ${PREV}"
          fi

          git log --pretty=format:'%s' "$RANGE" > /tmp/raw.txt || true

          FEATS=$(grep -E '^feat(\(|:|!| )'  /tmp/raw.txt | sed 's/^/- /' || true)
          FIXES=$(grep -E '^fix(\(|:|!| )'   /tmp/raw.txt | sed 's/^/- /' || true)
          OTHER=$(grep -vE '^(feat|fix|docs|chore)(\(|:|!| )' /tmp/raw.txt \
                  | grep -v '^$' | sed 's/^/- /' || true)

          {
            echo "since_text=$SINCE_TEXT"
            echo "feats<<EOF"
            [[ -n "$FEATS" ]] && echo "$FEATS" || echo "- No user-facing changes"
            echo "EOF"
            echo "fixes<<EOF"
            [[ -n "$FIXES" ]] && echo "$FIXES" || echo "- No fixes in this release"
            echo "EOF"
            echo "other<<EOF"
            [[ -n "$OTHER" ]] && echo "$OTHER" || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compose release body
        shell: bash
        env:
          TAG:          ${{ needs.guard.outputs.version }}
          SINCE:        ${{ steps.changelog.outputs.since_text }}
          FEATS:        ${{ steps.changelog.outputs.feats }}
          FIXES:        ${{ steps.changelog.outputs.fixes }}
          OTHER:        ${{ steps.changelog.outputs.other }}
          LINUX_BASE:   ${{ steps.sums.outputs.linux_base }}
          LINUX_FULL:   ${{ steps.sums.outputs.linux_full }}
          WIN_BASE:     ${{ steps.sums.outputs.win_base }}
          WIN_FULL:     ${{ steps.sums.outputs.win_full }}
          CARRIED_BASE: ${{ steps.carry.outputs.carried_base }}
          CARRIED_FULL: ${{ steps.carry.outputs.carried_full }}
          PREV_TAG:     ${{ steps.prev.outputs.tag }}
          REPO:         ${{ github.repository }}
        run: |
          set -e
          SUMMARY=""
          if [[ "$CARRIED_BASE" == "true" ]]; then
            SUMMARY="${SUMMARY}* The **base** variant was carried over from \`${PREV_TAG}\` — its source branch had no new commits requiring a rebuild.\n"
          fi
          if [[ "$CARRIED_FULL" == "true" ]]; then
            SUMMARY="${SUMMARY}* The **full** variant was carried over from \`${PREV_TAG}\` — its source branch had no new commits requiring a rebuild.\n"
          fi

          cat > body.md <<EOF
          # Skyroom Bot ${TAG}

          Automated release built from \`${GITHUB_SHA::7}\`.

          Skyroom Bot is a desktop application that automatically joins your scheduled Skyroom classes, keeps a WebSocket watchdog running to recover from dropped connections, and can hibernate your machine between sessions and wake it before each class.

          ## Which variant do I want?

          - **Base** — classic SkyroomBot. Joins classes, watches the connection, sleeps and wakes. No live listener. ~50 MB, single file.
          - **Full** — everything in base, plus the Jarvis live listener: transcribes the class audio, extracts instructions, and queues actions for your approval. Distributed as an archive because the runtime is larger.

          ## Downloads

          | Platform | Variant | File |
          |---|---|---|
          | Windows (x86-64) | base | \`${WIN_BASE}\` |
          | Windows (x86-64) | full | \`${WIN_FULL}\` |
          | Linux (x86-64)   | base | \`${LINUX_BASE}\` |
          | Linux (x86-64)   | full | \`${LINUX_FULL}\` |

          A \`SHA256SUMS\` file is attached for scripted verification.

          ${SUMMARY}
          ## System requirements

          - **Google Chrome** must be installed. Chromedriver is bundled — you do **not** need Selenium, Python, or a driver installed separately.
          - **Windows:** Windows 10 or newer (x86-64).
          - **Linux:** any modern x86-64 distro with \`glibc\` 2.31+ (Ubuntu 20.04+, Fedora 32+, Debian 11+).

          The **full** variant downloads the Whisper model (~3 GB) on first live-mode use and, optionally, CUDA libraries (~1 GB) if an NVIDIA GPU is present. Internet required once.

          ## Installation

          **Windows**
          - **base:** download the \`.exe\` and double-click.
          - **full:** download the \`.zip\`, extract it, and run \`SkyroomBot\\SkyroomBot.exe\`.

          **Linux**
          - **base:** \`chmod +x SkyroomBot-*-linux-x64-base\` then run it.
          - **full:** \`tar -xzf SkyroomBot-*-linux-x64-full.tar.gz\` then run \`SkyroomBot/SkyroomBot\`.

          Verify downloads with:
          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          ---

          ## ${SINCE}

          ### Features
          ${FEATS}

          ### Fixes
          ${FIXES}
          EOF

          if [[ -n "${OTHER}" ]]; then
            { echo ""; echo "### Other changes"; echo "${OTHER}"; } >> body.md
          fi

          cat >> body.md <<EOF

          ---

          ## Notes

          - Configuration and window layout are persisted per user.
          - Bug reports welcome via Issues.
          EOF

          cat body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.version }}
          name: Skyroom Bot ${{ needs.guard.outputs.version }}
          body_path: body.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/SkyroomBot-*
            release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
