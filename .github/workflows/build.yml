name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================
  # 0) Guard + version determination
  # =========================================================
  guard:
    name: Check trigger and compute version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version:      ${{ steps.ver.outputs.version }}
      version_nov:  ${{ steps.ver.outputs.version_nov }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to build
        id: check
        shell: bash
        run: |
          MSG="${{ github.event.head_commit.message }}"
          REF_TYPE="${{ github.ref_type }}"
          EVENT="${{ github.event_name }}"

          RUN="false"

          if [[ "$REF_TYPE" == "tag" ]]; then
            RUN="true"
            echo "Triggered by tag push"
          fi
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            RUN="true"
            echo "Triggered manually"
          fi
          if echo "$MSG" | grep -q '\[build\]'; then
            RUN="true"
            echo "Triggered by [build] keyword"
          fi
          if echo "$MSG" | grep -q '\[skip ci\]'; then
            RUN="false"
            echo "Skipped due to [skip ci]"
          fi

          echo "should_build=$RUN" >> "$GITHUB_OUTPUT"
          echo "Final decision: $RUN"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            BASE=$(cat VERSION | tr -d '[:space:]')
            TAG="v${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          # strip leading 'v' for filenames if you prefer no-v;
          # here we keep it, so version == tag.
          echo "version=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version_nov=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $TAG"

  # =========================================================
  # 1) Build
  # =========================================================
  build:
    name: Build on ${{ matrix.os }}
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ""
          - os: windows-latest
            platform: windows
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download matching chromedriver
        run: python scripts/download_chromedriver.py

      - name: Install Linux runtime libraries (Qt)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean --noconfirm skyroom_bot.spec

      - name: Rename output to final release name
        shell: bash
        run: |
          set -e
          VERSION="${{ needs.guard.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          EXT="${{ matrix.ext }}"
          FINAL="SkyroomBot-${VERSION}-${PLATFORM}-x64${EXT}"

          cd dist
          mv "SkyroomBot${EXT}" "$FINAL"
          echo "Final name: $FINAL"
          ls -la

      - name: Make Linux binary executable
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          chmod +x dist/SkyroomBot-${{ needs.guard.outputs.version }}-linux-x64

      - name: Smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          BIN="dist/SkyroomBot-${{ needs.guard.outputs.version }}-linux-x64"
          test -f "$BIN" && echo "binary exists"
          timeout 10 "$BIN" || true

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bin = "dist/SkyroomBot-${{ needs.guard.outputs.version }}-windows-x64.exe"
          if (-not (Test-Path $bin)) { throw "binary not built: $bin" }
          Write-Host "binary exists"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: dist/SkyroomBot-*-${{ matrix.platform }}-x64${{ matrix.ext }}
          if-no-files-found: error

  # =========================================================
  # 2) Release
  # =========================================================
  release:
    name: Publish GitHub Release
    needs: [guard, build]
    if: |
      needs.guard.outputs.should_build == 'true' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show files
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Generate checksums
        id: sums
        shell: bash
        run: |
          set -e
          VERSION="${{ needs.guard.outputs.version }}"
          WIN_FILE="SkyroomBot-${VERSION}-windows-x64.exe"
          LINUX_FILE="SkyroomBot-${VERSION}-linux-x64"

          WIN_SHA=$(sha256sum "artifacts/build-windows/${WIN_FILE}" | awk '{print $1}')
          LINUX_SHA=$(sha256sum "artifacts/build-linux/${LINUX_FILE}" | awk '{print $1}')
          WIN_SIZE=$(du -h "artifacts/build-windows/${WIN_FILE}" | cut -f1)
          LINUX_SIZE=$(du -h "artifacts/build-linux/${LINUX_FILE}" | cut -f1)

          {
            echo "win_sha=$WIN_SHA"
            echo "linux_sha=$LINUX_SHA"
            echo "win_size=$WIN_SIZE"
            echo "linux_size=$LINUX_SIZE"
            echo "win_file=$WIN_FILE"
            echo "linux_file=$LINUX_FILE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "$WIN_SHA  ${WIN_FILE}"
            echo "$LINUX_SHA  ${LINUX_FILE}"
          } > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Build changelog
        id: changelog
        shell: bash
        run: |
          set -e
          TAG="${{ needs.guard.outputs.version }}"
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]' \
                 | grep -v "^${TAG}$" | head -n1 || true)

          if [[ -z "$PREV" ]]; then
            RANGE="HEAD"
            SINCE_TEXT="Initial public release"
          else
            RANGE="${PREV}..HEAD"
            SINCE_TEXT="Changes since ${PREV}"
          fi

          git log --pretty=format:'%s' "$RANGE" > /tmp/raw_commits.txt || true

          FEATS=$(grep -E '^feat(\(|:|!| )'  /tmp/raw_commits.txt | sed 's/^/- /' || true)
          FIXES=$(grep -E '^fix(\(|:|!| )'   /tmp/raw_commits.txt | sed 's/^/- /' || true)
          DOCS=$(grep  -E '^docs(\(|:|!| )'  /tmp/raw_commits.txt | sed 's/^/- /' || true)
          CHO=$(grep   -E '^chore(\(|:|!| )' /tmp/raw_commits.txt | sed 's/^/- /' || true)
          OTHER=$(grep -vE '^(feat|fix|docs|chore)(\(|:|!| )' /tmp/raw_commits.txt \
                  | grep -v '^$' | sed 's/^/- /' || true)

          {
            echo "since_text=$SINCE_TEXT"
            echo "feats<<EOF"
            [[ -n "$FEATS" ]] && echo "$FEATS" || echo "- No user-facing changes"
            echo "EOF"
            echo "fixes<<EOF"
            [[ -n "$FIXES" ]] && echo "$FIXES" || echo "- No fixes in this release"
            echo "EOF"
            echo "docs<<EOF"
            [[ -n "$DOCS" ]] && echo "$DOCS" || true
            echo "EOF"
            echo "chore<<EOF"
            [[ -n "$CHO" ]] && echo "$CHO" || true
            echo "EOF"
            echo "other<<EOF"
            [[ -n "$OTHER" ]] && echo "$OTHER" || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compose release body
        shell: bash
        env:
          TAG:        ${{ needs.guard.outputs.version }}
          SINCE:      ${{ steps.changelog.outputs.since_text }}
          FEATS:      ${{ steps.changelog.outputs.feats }}
          FIXES:      ${{ steps.changelog.outputs.fixes }}
          DOCS:       ${{ steps.changelog.outputs.docs }}
          CHORE:      ${{ steps.changelog.outputs.chore }}
          OTHER:      ${{ steps.changelog.outputs.other }}
          LINUX_SHA:  ${{ steps.sums.outputs.linux_sha }}
          WIN_SHA:    ${{ steps.sums.outputs.win_sha }}
          LINUX_SIZE: ${{ steps.sums.outputs.linux_size }}
          WIN_SIZE:   ${{ steps.sums.outputs.win_size }}
          LINUX_FILE: ${{ steps.sums.outputs.linux_file }}
          WIN_FILE:   ${{ steps.sums.outputs.win_file }}
          REPO:       ${{ github.repository }}
          RUN_URL:    https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > release_body.md <<EOF
          # Skyroom Bot ${TAG}

          Automated release built from \`${GITHUB_SHA::7}\` on $(date -u '+%Y-%m-%d at %H:%M UTC').

          Skyroom Bot is a desktop application that automatically joins your scheduled Skyroom classes at a random time within a configurable window, keeps a WebSocket watchdog running to recover from dropped connections, and can hibernate your machine between sessions and wake it up right before each class.

          ---

          ## Downloads

          | Platform | File | Size | SHA-256 |
          |---|---|---|---|
          | **Windows** (x86-64) | [\`${WIN_FILE}\`](https://github.com/${REPO}/releases/download/${TAG}/${WIN_FILE}) | ${WIN_SIZE} | \`${WIN_SHA}\` |
          | **Linux** (x86-64)   | [\`${LINUX_FILE}\`](https://github.com/${REPO}/releases/download/${TAG}/${LINUX_FILE}) | ${LINUX_SIZE} | \`${LINUX_SHA}\` |

          A \`SHA256SUMS\` file is attached for scripted verification.

          ---

          ## System requirements

          - **Google Chrome** must be installed. The correct chromedriver is bundled inside each binary — you do **not** need to install Selenium, Python, or chromedriver yourself.
          - **Windows:** Windows 10 or newer (x86-64).
          - **Linux:** any modern x86-64 distribution with \`glibc\` 2.31 or newer (Ubuntu 20.04+, Fedora 32+, Debian 11+, or equivalent).

          ---

          ## Installation

          **Windows**
          1. Download \`${WIN_FILE}\`.
          2. Move it to a folder of your choice.
          3. Double-click to run.

          **Linux**
          1. Download \`${LINUX_FILE}\`.
          2. \`chmod +x ${LINUX_FILE}\`
          3. \`./${LINUX_FILE}\`

          **Verify the download**
          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          ---

          ## ${SINCE}

          ### Features
          ${FEATS}

          ### Fixes
          ${FIXES}
          EOF

          if [[ -n "${DOCS}" ]]; then
            { echo ""; echo "### Documentation"; echo "${DOCS}"; } >> release_body.md
          fi
          if [[ -n "${CHORE}" ]]; then
            { echo ""; echo "### Maintenance"; echo "${CHORE}"; } >> release_body.md
          fi
          if [[ -n "${OTHER}" ]]; then
            { echo ""; echo "### Other changes"; echo "${OTHER}"; } >> release_body.md
          fi

          cat >> release_body.md <<EOF

          ---

          ## Notes

          - This build targets the current stable Chrome for Testing release.
          - Configuration and window layout are persisted per user.
          - Bug reports are welcome via Issues.
          - Build log: ${RUN_URL}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.version }}
          name: Skyroom Bot ${{ needs.guard.outputs.version }}
          body_path: release_body.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/build-windows/${{ steps.sums.outputs.win_file }}
            artifacts/build-linux/${{ steps.sums.outputs.linux_file }}
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}