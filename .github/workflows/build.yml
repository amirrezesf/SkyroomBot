name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Required so the release job can create tags, releases, and attach files.
permissions:
  contents: write

jobs:
  # =========================================================
  # 1) Build on both operating systems in parallel
  # =========================================================
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SkyroomBot-linux
            binary_name: SkyroomBot
          - os: windows-latest
            artifact_name: SkyroomBot-windows
            binary_name: SkyroomBot.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download matching chromedriver
        run: python scripts/download_chromedriver.py

      - name: Install Linux runtime libraries (Qt)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean --noconfirm skyroom_bot.spec

      - name: Make Linux binary executable
        if: matrix.os == 'ubuntu-latest'
        run: chmod +x dist/${{ matrix.binary_name }}

      - name: Smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test -f dist/SkyroomBot && echo "binary exists"
          timeout 10 ./dist/SkyroomBot || true

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SkyroomBot.exe")) { throw "binary not built" }
          Write-Host "binary exists"

      # Package the binary into a zip (nice for casual downloaders)
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }}.zip ${{ matrix.binary_name }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\${{ matrix.binary_name }} `
                           -DestinationPath ${{ matrix.artifact_name }}.zip

      # Upload BOTH the zip and the raw binary as artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            dist/${{ matrix.binary_name }}
          if-no-files-found: error

  # =========================================================
  # 2) Release - runs only on push (not PRs)
  # =========================================================
  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so release notes can diff commits

      # ---- Compute the version/tag for this run ----
      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Triggered by pushing a v* tag: use it as-is
            TAG="${GITHUB_REF_NAME}"
          else
            # Triggered by a push to main: base-version + run number
            BASE=$(cat VERSION | tr -d '[:space:]')
            TAG="v${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "name=Release $TAG"  >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      # ---- Download both build artifacts ----
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what we got
        run: find artifacts -type f -exec ls -lh {} \;

      # ---- Generate SHA256 checksums for the release assets ----
      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f \( -name '*.zip' -o -name 'SkyroomBot' -o -name 'SkyroomBot.exe' \) \
            -exec sha256sum {} \; > SHA256SUMS
          cat SHA256SUMS

      # ---- Create the GitHub Release and attach everything ----
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          generate_release_notes: true     # auto-notes from commits/PRs since last release
          draft: false
          prerelease: false
          files: |
            artifacts/SkyroomBot-linux/SkyroomBot-linux.zip
            artifacts/SkyroomBot-linux/SkyroomBot
            artifacts/SkyroomBot-windows/SkyroomBot-windows.zip
            artifacts/SkyroomBot-windows/SkyroomBot.exe
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}